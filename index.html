<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terima Kasih untuk Teman Terbaik! 🌸</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Floating Flowers Background -->
    <div class="flower-bg">
        <span class="flower">🌸</span>
        <span class="flower">🌺</span>
        <span class="flower">🌷</span>
        <span class="flower">🌹</span>
        <span class="flower">🩷</span>
        <span class="flower">🌸</span>
        <span class="flower">🌺</span>
        <span class="flower">🌷</span>
    </div>

    <!-- Floating Hearts -->
    <div class="hearts-container">
        <span class="heart">💗</span>
        <span class="heart">💖</span>
        <span class="heart">💕</span>
        <span class="heart">💗</span>
        <span class="heart">💖</span>
        <span class="heart">💕</span>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="card">
            <div class="flower-decoration">
                🌸 🌺 🌷 🌹 🩷 🌹 🌷 🌺 🌸
            </div>
            
            <h1 class="title">Terima Kasih! 💕</h1>
            
            <div class="love-animation">
                💖 💗 💕 💖 💗 💕
            </div>
            
            <p class="message">
                "ikan hiu nelen paku, yakin gak kangen aku"
            </p>
            
            <p class="message-secondary">
                "wopyu pildakuuuu"
            </p>
            
            <div class="love-hearts">
                <span class="love">💗</span>
                <span class="love">❤️</span>
                <span class="love">💖</span>
                <span class="love">💕</span>
                <span class="love">💗</span>
            </div>
            
            <p class="thank-you">
                Terima kasih sudah menjadi teman yang luar biasa! 🌷
            </p>
            
            <p class="footer">
                Dibuat dengan 💕 untukmu
            </p>
            
            <div class="flower-bottom">
                🌸 🌺 🌷 🌹 🩷 🌹 🌷 🌺 🌸
            </div>
        </div>
    </div>

    <!-- Additional Floating Elements -->
    <div class="sparkles">
        <span class="sparkle">✨</span>
        <span class="sparkle">💫</span>
        <span class="sparkle">⭐</span>
        <span class="sparkle">✨</span>
        <span class="sparkle">💫</span>
    </div>

</body>
</html>
